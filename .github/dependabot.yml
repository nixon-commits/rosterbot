# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # This repo has FOUR Go modules: the root plus lambda/, opsnotify/ and
  # infra/. The nested ones pull the root in via `replace ../`, so they share
  # its dependency graph — bumping only the root leaves them stale, and a stale
  # nested go.mod does not fail any root build. It only surfaces as a failed
  # production `cdk deploy` when CDK bundles the GoFunction assets (this broke
  # the deploy three times running).
  #
  # So: watch every module, and GROUP them into a single PR so root and nested
  # modules move together and never drift apart mid-merge.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/lambda"
      - "/opsnotify"
      - "/infra"
    schedule:
      interval: "weekly"
    groups:
      go-modules:
        patterns:
          - "*"
    # chromedp and cdproto can only move together with the go-fantrax fork:
    # cdproto v0.157+ needs chromedp v0.18+, and chromedp v0.18+ is a generics
    # rewrite the fork's auth_client does not compile against (#229 went red on
    # exactly this). Held at main's pins until rosterbot-v9ig migrates the
    # fork; bump all three by hand, together, and delete this block then.
    ignore:
      - dependency-name: "github.com/chromedp/chromedp"
      - dependency-name: "github.com/chromedp/cdproto"

  # The workflow actions (checkout, setup-go, cache). Nothing else moves them,
  # and an action on a retired Node runtime fails the PR gate with no code
  # change. One grouped PR a week (rosterbot-nhpg).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # The Dockerfile's base images.
  #
  # Know what this does NOT do: both bases use floating tags
  # (golang:1.26-bookworm, debian:bookworm-slim), and Dependabot opens a PR
  # only when a tag's VERSION changes. A patched image behind the same tag
  # arrives through the next image build, not through a PR here, and a name
  # tag such as bookworm-slim has no version to compare. What catches an aged
  # image is the ECR scan on push (infra/infra.go).
  #
  # golang minor and major bumps are held back on purpose: the Go version is
  # also stated in go.mod, in buildspec.yml's runtime-versions and implied by
  # the pinned golangci-lint, and all of them must move together by hand.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
