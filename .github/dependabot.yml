# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # This repo has FOUR Go modules: the root plus lambda/, opsnotify/ and
  # infra/. The nested ones pull the root in via `replace ../`, so they share
  # its dependency graph — bumping only the root leaves them stale, and a stale
  # nested go.mod does not fail any root build. It only surfaces as a failed
  # production `cdk deploy` when CDK bundles the GoFunction assets (this broke
  # the deploy three times running).
  #
  # So: watch every module, and GROUP them into a single PR so root and nested
  # modules move together and never drift apart mid-merge.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/lambda"
      - "/opsnotify"
      - "/infra"
    schedule:
      interval: "weekly"
    groups:
      go-modules:
        patterns:
          - "*"
    # chromedp and cdproto can only move together with the go-fantrax fork:
    # cdproto v0.157+ needs chromedp v0.18+, and chromedp v0.18+ is a generics
    # rewrite the fork's auth_client does not compile against (#229 went red on
    # exactly this). Held at main's pins until rosterbot-v9ig migrates the
    # fork; bump all three by hand, together, and delete this block then.
    ignore:
      - dependency-name: "github.com/chromedp/chromedp"
      - dependency-name: "github.com/chromedp/cdproto"
