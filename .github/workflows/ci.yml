name: CI

# PR gate. NOTE: the scheduled bot jobs do NOT run on GitHub Actions (they run
# as ECS Fargate tasks launched by EventBridge — see docs/aws-deployment.md).
# Actions is used only for this build/test gate and for CodeQL.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build + vet root module
        run: |
          go build ./...
          go vet ./...

      # golangci-lint across all four modules. This calls `make lint` rather
      # than golangci-lint-action, for the same reason the Test step calls
      # `make test`: the gate that blocks a PR and the gate a developer runs
      # locally must be one definition, or they drift and only one of them is
      # actually enforcing anything. `make lint-install` pins the version from
      # the Makefile, so that string lives in exactly one place too.
      #
      # Placed before the slower test run so a lint failure reports fast.
      #
      # `make lint-version` (not a grep of this file) is the single source of
      # truth for the pin, so the cache key can never disagree with what
      # lint-install actually installs. GOTOOLVERSION comes from the live
      # toolchain (`go env GOVERSION`) rather than parsing go.mod's version
      # line, since setup-go can resolve a newer patch than go.mod states —
      # keying on the string actually running is what makes a toolchain bump
      # correctly invalidate the cache instead of silently reusing a binary
      # built against a different Go.
      - name: Resolve golangci-lint cache key inputs
        run: |
          echo "GOLANGCI_LINT_VERSION=$(make lint-version)" >> "$GITHUB_ENV"
          echo "GOTOOLVERSION=$(go env GOVERSION)" >> "$GITHUB_ENV"
          echo "GOLANGCI_LINT_BIN=$(go env GOPATH)/bin/golangci-lint" >> "$GITHUB_ENV"

      - name: Cache golangci-lint binary
        id: golangci-lint-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GOLANGCI_LINT_BIN }}
          key: golangci-lint-${{ runner.os }}-${{ env.GOTOOLVERSION }}-${{ env.GOLANGCI_LINT_VERSION }}

      # Network-free on a warm run: setup-go's module cache is keyed on
      # go.sum, so any go.sum change (a dependabot bump, an unrelated dep
      # add) makes the *next* run cold-download golangci-lint's whole
      # dependency graph through the proxy and verify it against
      # sum.golang.org — surface area for a step whose output is one pinned
      # binary (2026-09-02, run 33653268252: this died on a transient
      # sum.golang.org HTTP/2 error and a same-commit re-run passed). Caching
      # the binary itself, keyed independently of go.sum, removes that
      # exposure entirely on a cache hit.
      - name: Install golangci-lint
        if: steps.golangci-lint-cache.outputs.cache-hit != 'true'
        run: make lint-install

      - name: Lint (all modules)
        run: make lint

      # Every module importing a forked dep carries its own `replace` line for
      # it; nothing makes them agree. build-modules only catches that drift when
      # the bump changes an API — a pure constant-value bump (e.g. the Fantrax
      # APIVersion string) leaves a stale lambda/go.mod compiling clean and
      # shipping the old constant. See the check-pins comment in the Makefile.
      - name: Check shared replace pins agree across modules
        run: make check-pins

      # lambda/, opsnotify/ and infra/ are separate Go modules that the root
      # build never descends into. They pull the root via `replace ../`, so a
      # bump to a shared root dep re-stales them — and that only surfaced as a
      # failed production `cdk deploy` (it broke the deploy three times).
      # This is the gate that makes a stale nested module block the PR instead.
      - name: Build nested Go modules (lambda/, opsnotify/, infra/)
        run: make build-modules

      # `make test`, not `go test ./internal/...`. The nested modules
      # (lambda/, opsnotify/, infra/) have their own go.mod, so the root test
      # run never descends into them — and CI called the root run directly,
      # which meant every test in those modules was never executed here.
      #
      # That is not hypothetical. lambda's TestBuildStores_WiresEveryStoreField
      # exists because Trades and TradeValues were declared, routed and granted
      # IAM but never wired, so two endpoints answered 501 in production for
      # weeks with nothing failing. The guard written to catch the next one was
      # itself red and unnoticed, because nothing ran it. Same class as
      # check-pins, which CI does run for exactly this reason.
      - name: Test
        run: make test

      - name: Test stale-branch detection script
        run: bash .github/scripts/check-stale-critical-branches.test.sh
