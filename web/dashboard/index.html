<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rosterbot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <h1>rosterbot</h1>
    <button id="passkey-login-btn" type="button">Sign in with passkey</button>
    <p id="login-error" class="error"></p>
  </div>
</div>

<div id="bootstrap-screen" hidden>
  <form id="bootstrap-form" class="login-card">
    <h1>rosterbot</h1>
    <p id="bootstrap-prompt" class="muted">No passkey is registered yet. Setting up requires an invite link.</p>
    <div id="bootstrap-token-field" hidden>
      <label for="bootstrap-token-input">API token</label>
      <input id="bootstrap-token-input" type="password" autocomplete="off" placeholder="Paste ROSTERBOT_API_TOKEN">
    </div>
    <button id="bootstrap-submit" type="submit">Set up passkey</button>
    <p id="bootstrap-error" class="error"></p>
  </form>
</div>

<div id="shell" hidden>
  <header>
    <h1>rosterbot</h1>
    <!-- One link list serves both layouts. On desktop the two groups are
         `display: contents`, so all eleven links collapse into a single inline
         row exactly as before. Under 950px (measured: that row needs 946px)
         CSS re-anchors nav as a fixed bottom bar: .nav-primary becomes the
         four-item thumb row, .nav-secondary becomes a panel that opens above
         it. Grouping in markup rather than by wrap-order keeps the split
         deterministic; a single <a> list keeps app.js's active-link logic and
         live.js's Runs badge working unchanged in both layouts. -->
    <nav id="nav">
      <div class="nav-primary">
        <a href="#lineup">Lineup</a>
        <a href="#runs">Runs</a>
        <a href="#jobs">Jobs</a>
        <a href="#trades">Trades</a>
        <button id="nav-more" type="button" aria-expanded="false" aria-controls="nav-secondary">More</button>
      </div>
      <div class="nav-secondary" id="nav-secondary">
        <a href="#projections">Projections</a>
        <a href="#value">Value</a>
        <a href="#views">Views</a>
        <a href="#infra">Infra</a>
        <a href="#football">Football</a>
        <a href="#passkeys">Passkeys</a>
        <a href="#settings">Settings</a>
        <a href="#tenants" data-admin-only hidden>Tenants</a>
        <a href="https://d3g6t1hhf4o9r6.cloudfront.net" target="_blank" rel="noopener">Recap ↗</a>
      </div>
    </nav>
    <button id="logout-btn" type="button">Log out</button>
  </header>
  <div id="status-line" aria-live="polite"></div>
  <div id="live-hero"></div>
  <main id="view-root"></main>
  <div id="toasts" aria-live="polite"></div>
</div>

<script src="vendor/chart.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
