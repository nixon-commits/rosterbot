version: 0.2
# Built by AWS CodeBuild on push to main. Builds + pushes the app image to ECR,
# re-renders the projection dashboard, then runs `cdk deploy` so infrastructure
# changes (EventBridge schedules, task defs, IAM, Lambda) ship on merge — not
# just the image. Before this, a PR that touched infra/ rebuilt the image but its
# infra change was never applied until someone ran `cdk deploy` by hand.
#
# ECR_URI / CLUSTER / TASK_DEF / SUBNETS / SECURITY_GROUPS are injected by the
# CodeBuild project (CDK). The dashboard publish step reads its bucket and
# distribution ID from the outputs of the CDK deploy in this same build, so the
# first build that creates those resources also publishes the static site.
env:
  variables:
    # Go is selected via runtime-versions below, not downloaded here. Match the cdk
    # library version the infra module builds against.
    CDK_VERSION: "2.1128.1"
    # Pinned explicitly rather than inherited from the image's goenv, so the
    # cache: paths: block at the bottom names the directories Go actually
    # writes. These carry the compiled aws-cdk-go bindings + module downloads
    # across builds via the project's S3 cache (infra.go's BuildCache bucket);
    # a path mismatch has no error anywhere — cdk synth just goes back to
    # 130s of cold compile (measured, build 290).
    # TestBuildspec_GoCacheDirsArePinnedAndCached pins the agreement.
    GOCACHE: "/root/.cache/go-build"
    GOMODCACHE: "/root/go/pkg/mod"
    # Where the Node dist tarball is cached between builds (see the install
    # phase and the cache: paths: block; TestBuildspec_NodeInstallsAfterTheCacheRestore
    # pins all three together).
    NODE_DIST_CACHE: "/root/.cache/node-dist"
phases:
  install:
    # Pin every image-provided runtime this build actually uses. Without this,
    # CodeBuild picks the image default, which silently moves as versions reach
    # EOL -- that is how the cdk CLI ended up running on end-of-life Node 18 and
    # warning on every build (rosterbot-2no). node runs the aws-cdk CLI below;
    # python3 parses cdk-outputs.json in post_build.
    #
    # nodejs is DELIBERATELY absent here, though the build needs Node 22+.
    # runtime-versions installs run during DOWNLOAD_SOURCE, BEFORE the S3
    # cache restore (measured, build 295: `n` ran at 18:03:36, "Downloading
    # S3 cache" at 18:04:10) -- so a nodejs pin here re-downloads Node from
    # nodejs.org on every fresh host, ~33-45s, and no cache path can ever
    # help it. Node is installed by the first install command below instead,
    # which runs after the restore and can therefore hit $NODE_DIST_CACHE.
    # The image's EOL default Node is never invoked: nothing runs node before
    # that command replaces it.
    runtime-versions:
      # Quoted: YAML would read a bare 3.10 as the float 3.1 and select the wrong
      # runtime. 3.12 happens to survive unquoted; the next edit might not.
      python: "3.12"
      # 1.26, not infra/go.mod's 1.25 floor: cdk deploy locally bundles the lambda/
      # + opsnotify/ GoFunctions with this host go, and both require go 1.26.1 --
      # 1.26 satisfies every module the host builds (infra too) without a toolchain
      # auto-download. The AL2023 image exposes golang 1.20-1.26 (see infra.go), so
      # pin it like python instead of inheriting a default that shifts on EOL.
      golang: "1.26"
    commands:
      # Install Node from the cached dist tarball -- the post-cache-restore twin
      # of the runtime-versions pin this replaces (see the comment above).
      # $NODE_22_VERSION is the image's own exact pin for its "22" runtime (an
      # image ENV, present whether or not runtime-versions selects nodejs), so
      # this tracks the same version the pin would have installed, and the :?
      # guard fails the build loudly if an image update ever drops the var.
      # linux-arm64 matches the Graviton build host (infra.go BuildImage); if
      # the compute ever changes, curl -f 404s loudly here. The .tmp+mv keeps a
      # truncated download from poisoning the cache: curl -f exits nonzero on
      # error, set -e stops before the mv, and the next build re-fetches.
      # Caching the ~30MB tarball rather than the ~190MB unpacked tree keeps
      # the per-build cache upload tax near zero.
      - |
        set -eu
        : "${NODE_22_VERSION:?image no longer exports NODE_22_VERSION -- see the runtime-versions comment}"
        TARBALL="$NODE_DIST_CACHE/node-v${NODE_22_VERSION}-linux-arm64.tar.xz"
        if [ ! -f "$TARBALL" ]; then
          mkdir -p "$NODE_DIST_CACHE"
          curl -fsSL "https://nodejs.org/dist/v${NODE_22_VERSION}/node-v${NODE_22_VERSION}-linux-arm64.tar.xz" -o "$TARBALL.tmp"
          mv "$TARBALL.tmp" "$TARBALL"
        fi
        tar -xJf "$TARBALL" -C /usr/local --strip-components=1
      # cdk's app command is `go run infra.go`; the golang runtime above provides Go.
      # The cdk CLI is not on the image, so install it here.
      - go version
      - node --version
      - npm install -g "aws-cdk@${CDK_VERSION}"
      - cdk --version
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_URI"
      - TAG="$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-12)"
  build:
    commands:
      - docker build -t "$ECR_URI:latest" -t "$ECR_URI:$TAG" .
  post_build:
    commands:
      - docker push "$ECR_URI:latest"
      - docker push "$ECR_URI:$TAG"
      # Apply infra before publishing the dashboard. The outputs file makes the
      # newly-created bucket/distribution available to this very first build;
      # CodeBuild environment variables would not update until the next build.
      # --all, not a bare `cdk deploy`. The app has synthesized TWO stacks since
      # InfraCertStack was added for the us-east-1 rosterbot.dev certificate
      # (CloudFront reads viewer certs from that region only); InfraStack in
      # us-west-1 consumes the cert ARN across regions. cdk refuses a bare
      # deploy on a multi-stack app -- "Since this app includes more than a
      # single stack, specify which stacks to use ... or specify `--all`" -- and
      # exits 1, so every push to main fails here until this says --all. That is
      # exactly how the domain work, which was only ever deployed by a hand-run
      # `cdk deploy --all`, passed locally and failed its first CI build.
      # TestBuildspec_NamesStacksExplicitly pins it, asserting explicitness
      # rather than a stack count so a future third stack cannot reintroduce it.
      #
      # CDK orders the two from the cross-region reference, so --all needs no
      # explicit stack names, and --outputs-file stays keyed by stack name so
      # the DashboardBucketName lookup below is unaffected.
      #
      # set -e so a failed deploy fails HERE. Without it the block's exit status
      # is `cd ..`, execution continues, and the next block dies on the missing
      # cdk-outputs.json — so CodeBuild names the dashboard sync as the failing
      # command for an error that happened in cdk deploy 90 seconds earlier
      # (rosterbot-ill).
      # --method=direct: skip changeset creation. The default
      # create-changeset-then-execute pays ~26s per stack per build (measured,
      # build 290) for a preview nothing reads — --require-approval is never
      # and no human inspects a CI deploy before it lands. Direct UpdateStack
      # still rolls back on failure; only the unread preview is dropped.
      # TestBuildspec_DeploysWithoutAChangeset pins it.
      - |
        set -e
        cd infra && cdk deploy --all -c enableBuild=true --require-approval never --method=direct --outputs-file ../cdk-outputs.json
        cd ..
      # Publish the static dashboard on every build, including the first build
      # that created its bucket and distribution above.
      - |
        set -eu
        DASHBOARD_BUCKET="$(python3 -c 'import json; print(json.load(open("cdk-outputs.json"))["InfraStack"]["DashboardBucketName"])')"
        DASHBOARD_CF_DIST_ID="$(python3 -c 'import json; print(json.load(open("cdk-outputs.json"))["InfraStack"]["DashboardCdnId"])')"
        aws s3 sync web/dashboard "s3://$DASHBOARD_BUCKET" --delete --exclude "report/*" --exclude ".well-known/*"
        # The AASA file is EXCLUDED from the sync above and copied explicitly,
        # because Apple requires it served as application/json and it has no
        # file extension -- `aws s3 sync` types extensionless objects as
        # binary/octet-stream, which fails universal-link and webcredentials
        # association. This runs on EVERY build, not once: a one-off
        # `aws s3 cp --content-type` would be silently reverted by the next
        # sync, and the symptom (passkeys and universal links quietly stop
        # associating) points nowhere near a content-type. The exclude is what
        # makes the copy the sole writer, so there is no ordering race between
        # the two commands.
        aws s3 cp web/dashboard/.well-known/apple-app-site-association \
          "s3://$DASHBOARD_BUCKET/.well-known/apple-app-site-association" \
          --content-type application/json
        aws cloudfront create-invalidation --distribution-id "$DASHBOARD_CF_DIST_ID" --paths '/*'
      # Re-render the projection dashboard with the image just pushed, so a push
      # to main updates the site immediately instead of waiting for the daily
      # ProjectionSite schedule. Fargate pulls :latest fresh on each RunTask, so
      # this uses the new build. Reuses the API's egress-only SG + public subnets.
      #
      # $TASK_DEF is a CodeBuild project env var baked in as of the *previous*
      # deploy, so it still names the pre-deploy revision after a build that
      # changes the task/container definition (which bumps the revision) --
      # meanwhile GrantRun's IAM policy is scoped to the task definition
      # resource's current ARN, which cdk deploy above just updated to the new
      # revision. Calling RunTask with the stale revision then fails
      # AccessDeniedException (confirmed live, build #101, revision :4 stale
      # vs :5 current). Stripping the ":N" suffix passes the bare family ARN,
      # which ECS resolves to whatever revision is ACTIVE right now -- always
      # in sync with the IAM policy, which is scoped the same way.
      - |
        if [ -n "${CLUSTER:-}" ]; then
          TASK_DEF_FAMILY="${TASK_DEF%:*}"
          aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF_FAMILY" \
            --launch-type FARGATE \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"bot","command":["projection-site","--out","report","--scope","league"]}]}'
        else
          echo "CLUSTER not set (project env not yet deployed via cdk); skipping projection-site render"
        fi
# Saved to / restored from the Build project's S3 cache bucket (infra.go's
# BuildCache). Each entry must cover the matching env: variables: pin above —
# the cache restores only what is named here, and a divergence is invisible:
# the build is merely slow again, never red.
cache:
  paths:
    - "/root/.cache/go-build/**/*"
    - "/root/go/pkg/mod/**/*"
    - "/root/.cache/node-dist/**/*"
